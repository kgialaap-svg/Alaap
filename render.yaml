services:
  # Render Web Service for Alaap Express Backend
  - type: web
    name: alaap-backend
    env: node
    region: singapore # or oregon, frankfurt, etc.
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
